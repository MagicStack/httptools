name: Tests

on:
  push:
    branches: [master, ci]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify-tests:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
    - name: Check for a version PR
      id: version
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      with:
        script: |
          let isRelease = false;
          if (context.eventName === 'pull_request') {
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            isRelease = files.some(({filename}) => filename === 'httptools/_version.py');
          }
          core.setOutput('is_release', isRelease ? 'true' : 'false');

  typecheck:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - name: Set up Python
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        python-version: "3.14"
        activate-environment: true

    - name: Install dependencies
      run: uv pip install -e . --group dev

    - name: Type check
      run: pyright

    - name: Audit GitHub Actions workflows
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482  # v0.6.4
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        token: ${{ github.token }}
        online-audits: true
        advanced-security: false
        annotations: true

  build:
    needs: classify-tests
    if: needs.classify-tests.outputs.is_release != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
        os: [ubuntu-24.04, macos-26, windows-2025, windows-11-arm]
        exclude:
          - os: macos-26
            python-version: "3.9"
          - os: windows-11-arm
            python-version: "3.9"
          - os: windows-11-arm
            python-version: "3.10"

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        submodules: true
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true

    - name: Install dependencies
      run: uv pip install -e . --group dev

    - name: Test
      run: python -m unittest -v tests.suite

  # A stable required check for branch protection, including version PRs.
  regression-tests:
    name: Regression Tests
    needs: [classify-tests, typecheck, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
    - name: Check required jobs
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        JOBS: ${{ toJSON(needs) }}
      with:
        script: |
          const jobs = JSON.parse(process.env.JOBS);
          const expected = {
            'classify-tests': 'success',
            typecheck: 'success',
            build: jobs['classify-tests'].outputs.is_release === 'true' ? 'skipped' : 'success',
          };
          for (const [job, result] of Object.entries(expected)) {
            if (jobs[job].result !== result) {
              core.setFailed(`${job}: expected ${result}, got ${jobs[job].result}`);
            }
          }
